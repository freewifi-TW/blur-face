name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 建立 Release 需要

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            icon: assets/icon.icns
            sep: ":"
            extra: ""
          - os: windows-latest
            icon: assets/icon.ico
            sep: ";"
            # Windows 額外掛上版本資源（公司 / 產品名稱、版本號），降低防毒啟發式誤判
            extra: --version-file version_info.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # PyInstaller 預編譯的 bootloader 被所有 PyInstaller 程式共用，早被防毒的 ML 模型學成「可疑特徵」，
      # 是 Windows Defender 誤報 Trojan:Win32/Wacatac.C!ml 的主因。
      # Windows 改從原始碼（sdist）編譯 bootloader，讓 exe 的 bootloader hash 與大家不同。runner 內建 MSVC 可直接編。
      # 注意：sdist 裡其實也附了 Windows 預編譯 bootloader（給 MSYS2 使用者），單靠 --no-binary 不會重編，
      # 必須設 PYINSTALLER_COMPILE_BOOTLOADER 強制 hatch_build.py 跑 waf。
      - name: Install PyInstaller (Windows, build bootloader from source)
        if: runner.os == 'Windows'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller pyinstaller

      # 自我檢查：裝好的 bootloader 必須與官方 wheel 裡的不同，否則上面的編譯其實沒發生
      - name: Verify bootloader differs from official wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'EOF'
          import hashlib, pathlib, subprocess, sys, zipfile
          import PyInstaller
          ver = PyInstaller.__version__
          rel = "PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          local = pathlib.Path(PyInstaller.__file__).parent / "bootloader/Windows-64bit-intel/runw.exe"
          subprocess.run([sys.executable, "-m", "pip", "download", "-q", "--no-deps", "--only-binary", ":all:",
                          f"pyinstaller=={ver}", "-d", "official_wheel"], check=True)
          whl = next(pathlib.Path("official_wheel").glob("pyinstaller-*.whl"))
          official = hashlib.sha256(zipfile.ZipFile(whl).read(rel)).hexdigest()
          ours = hashlib.sha256(local.read_bytes()).hexdigest()
          print(f"PyInstaller {ver}\n官方 wheel runw.exe : {official}\n本次編譯 runw.exe : {ours}")
          if official == ours:
              sys.exit("bootloader 與官方 wheel 相同，沒有真的從原始碼編譯！")
          print("OK：bootloader 為本次自行編譯")
          EOF

      - name: Install PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: pip install pyinstaller

      # 從 tag（v1.2.3 → 1.2.3.0）產生 Windows 版本資源檔；workflow_dispatch 沒有 tag 時用 0.0.0.0
      - name: Generate version_info.txt (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'EOF'
          import os, re
          ref = os.environ.get("GITHUB_REF_NAME", "")
          m = re.match(r"^v(\d+)\.(\d+)\.(\d+)", ref)
          nums = [int(x) for x in m.groups()] if m else [0, 0, 0]
          ver = ".".join(map(str, nums))
          ver4 = tuple(nums + [0])
          text = f"""VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={ver4},
              prodvers={ver4},
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0),
            ),
            kids=[
              StringFileInfo([
                StringTable('040904B0', [
                  StringStruct('CompanyName', 'Alex Wang'),
                  StringStruct('FileDescription', 'BlurFace - offline AI face anonymizer'),
                  StringStruct('FileVersion', '{ver}'),
                  StringStruct('InternalName', 'BlurFace'),
                  StringStruct('LegalCopyright', 'Copyright (c) 2026 Alex Wang'),
                  StringStruct('OriginalFilename', 'BlurFace.exe'),
                  StringStruct('ProductName', 'BlurFace'),
                  StringStruct('ProductVersion', '{ver}'),
                ]),
              ]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])]),
            ],
          )
          """
          open("version_info.txt", "w", encoding="utf-8").write(text)
          print(text)
          EOF

      # --noupx：明確關掉 UPX 壓縮，被壓縮過的 exe 更容易被防毒誤判
      - run: pyinstaller --noconfirm --windowed --noupx --name BlurFace --icon "${{ matrix.icon }}" --add-data "models${{ matrix.sep }}models" ${{ matrix.extra }} gui.py

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=offscreen dist/BlurFace.app/Contents/MacOS/BlurFace --smoke-test

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/BlurFace/BlurFace.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent BlurFace.app BlurFace-macos.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/BlurFace -DestinationPath dist/BlurFace-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BlurFace-${{ runner.os }}
          path: dist/*.zip

      # 推 v* tag 時，把打包檔直接掛上該 tag 的 GitHub Release（沒有就自動建立）
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
